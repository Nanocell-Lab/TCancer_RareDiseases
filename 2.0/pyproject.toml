[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rare-oncology"
version = "2.0.0"
description = "Cruce reproducible de variantes ClinVar/Orphanet con mutaciones somaticas GDC/TCGA."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Cancer Molecular Dynamics Laboratory" }
]
dependencies = []

[project.optional-dependencies]
plots = [
  "geneview==0.8.2",
  "matplotlib>=3.8",
]

[project.scripts]
rare-oncology = "rare_oncology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
